<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#173d63"><meta name="description" content="Gerador de mensagens de registro de atendimento técnico Intelimaq."><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>Intelimaq | Assistência Técnica</title></head>
<body><main class="container"><header class="brand"><div class="brand-mark">⚙️</div><div><h1>INTELIMAQ</h1><p>Assistência Técnica</p></div></header>
<section class="panel"><h2>Gerar registro de atendimento</h2><p class="intro">Preencha os dados disponíveis e gere uma mensagem pronta para enviar pelo WhatsApp.</p><form id="messageForm">
<div class="field"><label for="treatment">Tratamento do cliente <span>(opcional)</span></label><select id="treatment"><option value="">Não informar</option><option value="Sr.">Sr.</option><option value="Sra.">Sra.</option></select></div>
<div class="field"><label for="client">Nome do cliente <span>(opcional)</span></label><input id="client" type="text" placeholder="Ex.: Antônio"></div>
<div class="field"><label for="machine">Modelo da máquina <span>(opcional)</span></label><input id="machine" type="text" placeholder="Ex.: IQ50"></div>
<div class="field"><label for="serial">Número de série <span>(opcional)</span></label><input id="serial" type="text" placeholder="Número de série do equipamento"></div>
<div class="field"><label for="description">Descrição do atendimento <span>(opcional)</span></label><textarea id="description" rows="5" placeholder="Descreva o que foi conversado, orientado ou realizado."></textarea></div>
<div class="field"><label for="technician">Técnico responsável</label><select id="technician" required><option>Alison Moura</option><option>Jonathan Xavier</option><option>Raphael Soares</option></select></div>
<div class="actions"><button type="submit" class="primary">Gerar mensagem</button><button type="button" id="copyBtn" class="secondary">Copiar mensagem</button><button type="button" id="shareBtn" class="secondary">Compartilhar</button></div></form></section>
<section class="panel output-panel"><div class="output-heading"><h2>Prévia da mensagem</h2><span id="status" role="status" aria-live="polite"></span></div><textarea id="output" rows="16" readonly aria-label="Prévia da mensagem gerada" placeholder="A mensagem aparecerá aqui."></textarea><p class="privacy-note">🔒 Os dados não são salvos nem mantidos em histórico. A mensagem é montada neste dispositivo.</p></section><footer>Intelimaq · Assistência Técnica</footer></main><script src="app.js"></script></body></html>
