<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#173d63"><meta name="description" content="Registro de atendimentos técnicos Intelimaq."><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>Intelimaq | Assistência Técnica</title></head>
<body><main class="container"><header class="brand"><div class="brand-mark">⚙️</div><div><h1>INTELIMAQ</h1><p>Assistência Técnica</p></div></header>
<section class="panel"><h2>Registrar atendimento</h2><p class="intro">Selecione uma empresa ou cadastre uma nova. Os atendimentos ficam vinculados à empresa, mesmo quando o contato muda.</p>
<form id="messageForm">
<div class="field"><label for="companySelect">Empresa cliente</label><div class="inline-controls"><select id="companySelect" required><option value="">Carregando empresas...</option></select><button type="button" id="addCompanyBtn" class="secondary">+ Empresa</button></div></div>
<div class="field"><label for="contact">Pessoa de contato <span>(opcional)</span></label><input id="contact" type="text" placeholder="Ex.: João da Silva"></div>
<div class="field"><label for="machine">Modelo da máquina <span>(opcional)</span></label><input id="machine" type="text" placeholder="Ex.: IQ50"></div>
<div class="field"><label for="serial">Número de série <span>(opcional)</span></label><input id="serial" type="text" placeholder="Número de série do equipamento"></div>
<div class="field"><label for="description">Descrição do atendimento <span>(opcional)</span></label><textarea id="description" rows="5" placeholder="Descreva o que foi conversado, orientado ou realizado."></textarea></div>
<div class="field"><label for="technician">Técnico responsável</label><select id="technician" required><option>Alison Moura</option><option>Jonathan Xavier</option><option>Raphael Soares</option></select></div>
<div class="actions"><button type="submit" class="primary">Salvar atendimento</button><button type="button" id="generateBtn" class="secondary">Gerar mensagem</button></div></form></section>
<section class="panel output-panel"><div class="output-heading"><h2>Prévia da mensagem</h2><span id="status" role="status" aria-live="polite"></span></div><textarea id="output" rows="13" readonly aria-label="Prévia da mensagem gerada" placeholder="A mensagem aparecerá aqui."></textarea><div class="actions"><button type="button" id="copyBtn" class="secondary">Copiar mensagem</button><button type="button" id="shareBtn" class="secondary">Compartilhar</button></div></section>
<section class="panel"><h2>Histórico de atendimentos</h2><div class="field"><label for="searchHistory">Pesquisar por empresa, contato, modelo ou nº de série</label><input id="searchHistory" type="search" placeholder="Digite para pesquisar..."></div><button type="button" id="refreshHistoryBtn" class="secondary">Atualizar histórico</button><div id="history" class="history-list"><p class="muted">Carregando histórico...</p></div></section>
<footer>Intelimaq · Assistência Técnica</footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script></body></html>
